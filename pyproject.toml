[project]
name = "meed"
version = "0.4.0"
description = "Email notifications for RSS/Atom feeds"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.44.6",
    "environs>=15.2.0",
    "feedparser>=6.0.14",
    "imap-tools>=1.16.0",
    "json-log-formatter>=1.2.1",
    "pydantic>=2.14.3",
    "sentry-sdk>=2.75.0",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.107",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# An unrecognised key in this section is otherwise ignored.
strict_config = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "BLE001",   # catch Exception
    "C901",     # function is too complex
    "COM812",   # missing-trailing-comma
    "CPY001",   # copyright notices
    "D",        # pydocstyle
    "EM101",    # exception with string literal
    "FIX002",   # TODO
    "G004",     # logging f-string
    "ISC001",   # single-line-implicit-string-concatenation
    "PLC0415",  # import should be at top-level
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value used in comparison
    "S101",     # use of assert (fine in tests)
    "SIM108",   # ternary operator
    "T201",     # print found (appropriate for CLI commands)
    "TD",       # TODO
    "TRY003",   # long messages outside the exception class
    "TRY300",   # consider moving statement to else block
    "TRY400",   # logging.error
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
# The helpers that build test feeds take every field of an entry.
"tests/**" = ["PLR0917"]
