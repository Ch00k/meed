name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run linting
        run: make lint

      - name: Run tests
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true

  # meed runs as one scheduled Fly Machine (see "Deployment" in README.md). `fly deploy` is not used: it manages only
  # Machines in a fly.toml process group and would not keep the schedule. The Machine is updated in place instead.
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      IMAGE: registry.fly.io/meed:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fly registry tokens expire in about five minutes, so authenticate after the build.
      - name: Push image to Fly registry
        run: |
          flyctl auth docker
          docker push "$IMAGE"

      # The Machine is replaced rather than updated: `fly machine update` can drop a Machine from Fly's scheduler while
      # its config still says hourly, while a new Machine's schedule starts with the Machine. Without --force, Fly
      # refuses to destroy a Machine that is running a check, so a deploy never cuts one short; re-run the job then.
      - name: Replace the Machine
        run: |
          machines=$(flyctl machine list --app meed --json | jq -r '.[].id')
          if [ "$(echo "$machines" | wc -w)" -gt 1 ]; then
            echo "Expected at most one Machine in app meed, found: $machines"
            exit 1
          fi
          if [ -n "$machines" ]; then
            flyctl machine destroy "$machines" --app meed
          fi
          flyctl machine run "$IMAGE" --app meed --region fra --name meed --volume meed_data:/data \
            --vm-size shared-cpu-1x --vm-memory 256 --restart no --schedule hourly --detach

      # The new Machine runs one check straight away. One that never stops holds the schedule, and the bill, forever.
      - name: Wait for the first check to finish
        run: flyctl machine wait "$(flyctl machine list --app meed --json | jq -r '.[0].id')" --app meed --state stopped
